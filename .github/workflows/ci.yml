name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            label: macOS 15 arm64
            macos-major: '15'
          - runner: macos-26
            label: macOS 26 arm64
            macos-major: '26'

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Show toolchain
        run: |
          uname -m
          sw_vers
          xcodebuild -version
          python3 --version

      - name: Set up audit Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.14'

      - name: Validate scripts and repository whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$BASE_SHA...$CURRENT_SHA"
          elif [[ "$EVENT_NAME" == "push" && ! "$BEFORE_SHA" =~ ^0+$ ]] \
            && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null \
            && git merge-base --is-ancestor "$BEFORE_SHA" "$CURRENT_SHA"; then
            git log --check --format= "$BEFORE_SHA..$CURRENT_SHA"
          else
            git log -1 --check --format=
          fi
          bash -n Scripts/*.sh
          Scripts/verify_release_build_settings.sh

      - name: Run Python tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 Scripts/check_python_license_inventory.py
          python3 -m unittest discover -s Scripts -p 'test_*.py'

      - name: Audit locked release dependencies
        run: |
          python3 -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            -r Runtime/audit-requirements.lock
          python3 -m pip_audit --require-hashes --no-deps --disable-pip --progress-spinner off -r Runtime/requirements.lock

      - name: Run Swift tests
        run: |
          xcodebuild \
            -project Source/QuickSRTProject/QuickSRT.xcodeproj \
            -scheme QuickSRT \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/TestDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_TESTABILITY=YES \
            ENABLE_HARDENED_RUNTIME=NO \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=YES \
            DEPLOYMENT_POSTPROCESSING=NO \
            COPY_PHASE_STRIP=NO \
            STRIP_INSTALLED_PRODUCT=NO \
            DEAD_CODE_STRIPPING=NO \
            test

      - name: Run primary workflow UI tests
        if: matrix.macos-major == '15'
        run: |
          xcodebuild \
            -project Source/QuickSRTProject/QuickSRT.xcodeproj \
            -scheme QuickSRTUI \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/UITestDerivedData" \
            test

      - name: Build clean Release app for compatibility checks
        run: |
          xcodebuild \
            -project Source/QuickSRTProject/QuickSRT.xcodeproj \
            -scheme QuickSRT \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/CompatibilityDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify clean first launch without model or caches
        run: |
          test ! -e Models
          test ! -e Runtime/Support
          Scripts/verify_clean_first_launch.sh \
            "$RUNNER_TEMP/CompatibilityDerivedData/Build/Products/Release/QuickSRT.app"

      - name: Collect compatibility evidence
        run: |
          python3 Scripts/collect_compatibility_evidence.py \
            --require-arm64 \
            --expect-macos-major '${{ matrix.macos-major }}' \
            --app "$RUNNER_TEMP/CompatibilityDerivedData/Build/Products/Release/QuickSRT.app" \
            --output "$RUNNER_TEMP/compatibility.json"

      - name: Upload compatibility evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compatibility-${{ matrix.runner }}
          path: ${{ runner.temp }}/compatibility.json
          if-no-files-found: error
          retention-days: 30

      - name: Verify clean-tree source archive
        run: Scripts/create_source_archive.sh "$RUNNER_TEMP/QuickSRT-source.zip"
